<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f1" />
    <script>
// Apply the saved theme before the first render to avoid a bright flash.
(() => {
  let saved = null;
  try { saved = localStorage.getItem('eyeliner-theme'); } catch { /* Storage may be disabled. */ }
  const theme = saved === 'light' || saved === 'dark'
    ? saved
    : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
  document.documentElement.style.colorScheme = theme;
})();
    </script>
    <link rel="preload" href="./cad/main-cad.glb" as="fetch" type="model/gltf-binary" crossorigin />
    <link rel="preload" href="./cad/main-cad.parts.json" as="fetch" type="application/json" crossorigin />
    <meta name="description" content="Eyeliner — 3lb meltybrain combat robot. Real CAD, Onshape export, PCBWay ordering, TPU printing, Teensy firmware." />
    <title>Eyeliner — Project workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
