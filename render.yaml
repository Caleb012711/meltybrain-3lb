# Render blueprint for the Eyeliner build site (static Vite bundle in web/).
# Dashboard path: New → Blueprint → select this repo. Or create the static
# site manually with the same settings (see web/README.md).
services:
  - type: web
    name: eyeliner-web
    env: static
    branch: main
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /cad/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /index.html
        name: Cache-Control
        value: no-cache
    previews:
      generation: automatic
    buildFilter:
      paths:
        - web/**
        - render.yaml
